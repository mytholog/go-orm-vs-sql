services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: demo
    ports: ['127.0.0.1:5432:5432']
    command: ['postgres', '-c', 'shared_preload_libraries=pg_stat_statements']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U demo -d demo']
      interval: 2s
      timeout: 3s
      retries: 30
